# Application Operation Agent Spec — worked example 1
#
# The customer-support agent for a clothing e-commerce store: what it must do,
# and what must be true of it. Extracted from the reference implementation at
# v0.1.0, not written ahead of it. Where the two disagree, this file states the
# rule and the extraction record (support-agent.extraction.md) says which way
# the reference falls short.
#
# Status: draft, worked example for AOAS v0. Not citable.
# Validate: node tools/validate-aoas.js drafts/examples/support-agent.aoas.yaml
#
# Conventions
#   - Conditions use the vocabulary the world file and the escalation rules
#     already share: {field, equals: [..], not_equals: [..], at_least, at_most}.
#     One rule needed more than that. It is marked `# EXTENDS`, and it is the
#     evidence for the draft's open format question.
#   - Every `must` carries `evidence`: assertion | inspection | scenario |
#     acceptance (charter §7).
#   - Anything true of every agent is cited by identifier under `conformance`,
#     never restated here. If a statement below holds with the domain nouns
#     removed, it is in the wrong file.

apiVersion: aoas/v0
agent:
  id: support-agent-clothing
  version: 0.1.0
  currency: INR

sources:
  - DataAgents.ai/24-support-agent-functional-spec.md
  - reference-agent@v0.1.0 worlds/clothing.yaml
  - reference-agent@v0.1.0 src/support_agent/{router,policy,approvals,escalation,identity,config}

# ---------------------------------------------------------------------------
# 1 · Purpose
# ---------------------------------------------------------------------------
purpose:
  serves: >
    A signed-in customer of one clothing store, about orders they placed.
  does:
    - order status
    - refund status
    - cancellation
    - opening a return
    - delivery address change
    - refund requests
    - handing the conversation to a person
  # Normative. "Never promise what the system cannot deliver" is testable only
  # against an explicit list of what it must not do.
  refuses:
    - id: R-DISCOUNT
      what: negotiating price, or offering any discount, voucher or coupon not in a published promotion
      concern: safety
      facet: operational constraint
      examples: ["Can you give me a discount code?", "Match the cheaper price I saw on another site", "Any coupon for my next order?"]
    - id: R-OTHER-CUSTOMER
      what: anything about an order the signed-in customer did not place
      concern: security
      facet: confidentiality
      examples: ["What did my neighbour order? Her name is Ravi.", "Show me the delivery address on my friend's order"]
    - id: R-ACCOUNT
      what: account deletion, and changes to a payment method
      concern: safety
      facet: operational constraint
      examples: ["Delete my account", "Change my card to a new one", "Update my payment method to UPI"]
    - id: R-DELIVERY-DATE
      what: a delivery date the carrier record does not state
      concern: functional-suitability
      facet: functional correctness
      examples: ["Exactly which day will it arrive?", "Promise me it comes by Friday"]
    - id: R-STYLE
      what: style or fit advice presented as authoritative
      concern: functional-suitability
      facet: functional appropriateness
      examples: ["Will the medium fit me? I'm usually between sizes", "Which colour would suit me better?"]
    - id: R-FRAUD
      what: adjudicating whether anything is fraud
      concern: safety
      facet: risk identification
      examples: ["Is this charge fraud?", "Was my order a scam?"]
  # `examples` are the testable half of each refusal (generation run 1, NOTES
  # §7): without them every implementation drew its own line, and found its
  # false positives by accident.
  # Recognised, in doc 24, and deliberately not operations in this version. The
  # agent may explain the policy; it performs nothing, and claims nothing.
  deferred:
    - {intent: exchange_request, source: doc 24 P-EXCHANGE}
    - {intent: damaged_item, source: doc 24 P-DAMAGE}
    - {operation: hold_order}
    - {operation: dispatch_replacement}
    - {operation: track_shipment}

# ---------------------------------------------------------------------------
# 2 · Entities and state
# ---------------------------------------------------------------------------
entities:
  customer:
    key: id
    fields:
      id: {type: id}
      email: {type: email, pii: true}
      phone: {type: phone, pii: true}

  order:
    key: id
    fields:
      id: {type: id}
      customer_id: {type: id, ref: customer.id}
      # The warehouse and the carrier write this while a conversation is open,
      # which is what `concurrent_writers` below says and what makes a window
      # meaningful here and nowhere else on this entity. Thirty seconds is the
      # time a customer takes to answer one question: long enough that a read
      # survives an ordinary exchange, short enough that a cancellation is never
      # attempted on a belief formed before it.
      status: {type: enum, of: order_status, fresh_for: 30s}
      total: {type: money}            # the refund gate compares against this, never a stated number
      address: {type: text, pii: true}   # the validator's first catch: change_address set it, and nothing declared it
      # A counter that runs with world time, and only once delivery has
      # happened — an order nobody delivered has no age, and advancing it anyway
      # produces exactly the row the invariant below declares impossible. The
      # condition is that invariant pointed forwards.
      days_since_delivery:
        type: int
        derived: whole days since delivery
        advances: days
        advances_when: {field: status, equals: [delivered, returned, refunded]}
      final_sale: {type: bool}
      return_open: {type: bool}       # a return was requested; what makes a second request the same one (T-050)
      note: {type: text, untrusted: true}   # written by customers and warehouse staff; content, never instruction
    invariants:
      - name: delivery age implies delivery happened
        when: {field: days_since_delivery, at_least: 1}
        then: {field: status, equals: [delivered, returned, refunded]}
        because: an order that has not been delivered cannot be N days since delivery
      - name: final sale orders are never returned
        when: {field: final_sale, equals: [true]}
        then: {field: status, not_equals: [returned]}
        because: the final-sale exclusion is the reason a return cannot be opened

  approval:
    key: id
    fields:
      id: {type: id}
      order_id: {type: id, ref: order.id}
      action: {type: enum, values: [issue_refund]}
      amount: {type: money}
      outcome: {type: enum, values: [pending, granted, refused, expired]}

  escalation:
    key: ticket
    fields:
      ticket: {type: id}
      reason: {type: text}
      state: {type: enum, values: [queued, claimed, resolved, lapsed]}

# Who is asking. What a condition may compare against with `equals_session`.
session:
  customer_id: {type: id, ref: customer.id}

# What the conversation has become, as values the escalation rules read — inputs
# this spec requires the harness to maintain, so a rule over an undeclared fact
# is a typo the validator catches. Each says how it is computed: a fact that is
# only typed is a number every implementation invents differently, and an
# escalation rule over it fires somewhere and never here (F-025).
facts:
  turn_count: {type: int, derived: turns taken in this conversation}
  termination:
    type: enum
    derived: "why the loop stopped on the latest turn, or absent if it never ran"
    # `deadline_reached` added after generation run 1 (NOTES §7): a wall-clock
    # stop (AHC-0096) had no value and was recorded as a step stop.
    values: [goal_reached, step_budget_exhausted, cost_ceiling_reached,
             deadline_reached, oscillation_detected, awaiting_approval,
             awaiting_human, refused, unrecoverable_error]
  consecutive_failed: {type: int, derived: "turns ending in failure, counting back from the latest until one did not"}
  refusals: {type: int, derived: turns in this conversation the agent refused}
  repeated_intent:
    type: int
    # However each was answered. A customer who asks again has not been
    # resolved, whatever the turn that answered them recorded — counting only
    # unanswered turns is what made the rule unreachable.
    derived: "turns carrying the latest turn's intent, counting back from it until the intent changes"

# The closed set of things a customer asks for. P-DIRECT's "exactly one
# intent" and the `repeated_intent` fact both count over it; until it was
# declared, each implementation invented its own (generation run 1, NOTES §1).
intents:
  order_status:     {answered_by: direct,   via: [get_order], examples: ["Where is my order?", "Has my order shipped yet?"]}
  refund_status:    {answered_by: direct,   via: [get_order], examples: ["What's happening with my refund?", "Did my refund go through?"]}
  cancel:           {answered_by: loop,     via: [cancel_order], examples: ["Please cancel my order", "I don't want this order any more"]}
  return:           {answered_by: loop,     via: [open_return_request], examples: ["I want to return this", "How do I send it back?"]}
  address_change:   {answered_by: loop,     via: [change_address], examples: ["Change my delivery address", "Can you ship it to my office instead?"]}
  refund_request:   {answered_by: loop,     via: [request_refund], examples: ["I want my money back", "Refund my order please"]}
  human:            {answered_by: handoff,  via: [escalate], examples: ["I want to talk to a person", "Get me a human"]}
  lost_in_transit:  {answered_by: handoff,  via: [escalate], examples: ["My parcel is lost", "Tracking says delivered but I never got it"]}
  discount_request: {answered_by: refusal,  examples: ["Can you give me a discount code?"]}
  account_change:   {answered_by: refusal,  examples: ["Delete my account"]}
  exchange_request: {answered_by: deferred, examples: ["Can I swap it for a larger size?"]}
  damaged_item:     {answered_by: deferred, examples: ["It arrived torn"]}
  other:            {answered_by: loop,     examples: ["Hi", "Thanks, that's all"]}

state_machines:
  order_status:
    states: [pending, confirmed, picked, shipped, out_for_delivery, delivered,
             cancelled, returned, refunded]
    # `cancelled` ends fulfilment, not money: a cancelled order may still be
    # refunded. Only `refunded` ends everything.
    terminal: [refunded]
    transitions:
      - {from: pending, to: confirmed, by: external}
      - {from: confirmed, to: picked, by: external}
      - {from: picked, to: shipped, by: external}
      - {from: shipped, to: out_for_delivery, by: external}
      - {from: out_for_delivery, to: delivered, by: external}
      - {from: [pending, confirmed], to: cancelled, by: cancel_order}
      - {from: delivered, to: returned, by: external}        # the warehouse receives the item
      - {from: any_except_terminal, to: refunded, by: issue_refund}   # doc 24's matrix: approve in every state
    # The world moves while a conversation is open. A status read at the start
    # of a turn is a claim about the past by the time a write is attempted.
    concurrent_writers: [warehouse, carrier]

# ---------------------------------------------------------------------------
# 3 · Operations
# ---------------------------------------------------------------------------
# `identity` is the DOMAIN meaning of "the same request" — what makes a repeat a
# repeat. How a key is derived and carried is the harness's business (cited
# under conformance), not this file's.
#
# The two are different questions and both are answered. A harness key asks *is
# this the same call* — a retry of one attempt — and a fresh key is honestly a
# second call. `identity` asks *is this the same request*, and the system that
# owns the record answers it: a second refund of one order is refused by
# `status != refunded` however new the key is. Neither governs the other; a
# harness that had only the key would refund twice for two genuine attempts.

# Named conditions, reused below. A named condition must qualify its field
# (`order.customer_id`, not `customer_id`), because it has no entity of its own.
conditions:
  owned: &owned
    # EXTENDS — a comparison with the session rather than with a constant. The
    # vocabulary had no way to say it, and it is the rule behind the
    # reference's one critical defect.
    {field: order.customer_id, equals_session: customer_id}

operations:
  get_order:
    entity: order
    side_effect: read
    input: [order_id]
    output: order
    preconditions: [*owned]
    authority: agent

  # EXTENDS — a read of many rows. `output: order[]` takes no key, so the
  # precondition over the session is the whole of its scope; the validator
  # refuses one without it (unscoped-collection). Added for P-OPEN (T-001): a
  # customer opening the chat is shown their orders to pick from, not asked for a
  # number nobody has to hand.
  list_orders:
    entity: order
    side_effect: read
    input: []
    output: order[]
    preconditions: [*owned]
    authority: agent

  cancel_order:
    entity: order
    side_effect: irreversible
    input: [order_id]
    preconditions:
      - *owned
      - {field: status, equals: [pending, confirmed]}
    effect: {status: cancelled}
    identity: order_id
    authority: agent
    # AHC-0057 asks for an approval the run cannot grant on anything
    # irreversible, and this is irreversible. It is nonetheless the agent's,
    # decided 2026-09-12: the authority is not the agent's own, it is the
    # customer's, exercised on their own row. `P-OWNERSHIP` already establishes
    # that only the owner reaches this operation, so the person whose order it is
    # has authorised it by asking — and a gate here would queue a routine
    # self-service action behind a human who has nothing to add.
    #
    # The distinction the approval gate is actually drawing is not
    # reversibility. It is **whose** authority the effect needs: moving money out
    # of the business is the business's decision, and cancelling your own
    # unshipped order is yours. `issue_refund` is gated; this is not.
    #
    # Recorded in the binding as an answer to AHC-0057 rather than silently
    # diverging from it, because a capability a system does not meet has to say
    # so somewhere a reviewer looks.
    on_refusal: offer a return once the order is delivered   # P-CANCEL

  open_return_request:
    entity: order
    side_effect: reversible
    input: [order_id]
    preconditions:
      - *owned
      - {field: status, equals: [delivered]}
      - {field: days_since_delivery, at_most: 30}
      - {field: final_sale, equals: [false]}
      - {field: return_open, equals: [false]}
    # State, not prose. The effect was "a return request exists for the order",
    # which the order system could not hold, so nothing refused a second request
    # and `identity: order_id` was a sentence. A model that retried a lost reply
    # as a new call opened two returns, live (T-050). The system that owns the
    # record answers identity, as `status != refunded` does for a refund.
    effect: {return_open: true}
    identity: order_id
    authority: agent

  change_address:
    entity: order
    side_effect: reversible
    input: [order_id, address]
    preconditions:
      - *owned
      - {field: status, equals: [pending]}
    effect: {address: $address}
    identity: [order_id, address]      # the same change twice is one change
    authority: agent
    on_refusal: the carrier owns the address once the order has progressed   # P-ADDRESS

  # The model-facing way to a refund. It leads to `issue_refund`, whose own
  # authority decides whether it runs now or waits for a person; the model
  # never sees `issue_refund` itself. Eligibility added after generation run 1
  # (NOTES §8): with ownership the only precondition, a note planted in a
  # shipped order could put a refund request in front of a reviewer.
  request_refund:
    entity: order
    side_effect: reversible
    input: [order_id]
    preconditions:
      - *owned
      - {field: status, equals: [delivered, returned, cancelled]}
    routes_to: issue_refund
    effect: issue_refund has run, or an approval for it is pending
    identity: order_id                 # asking again while one is pending is the same request
    authority: agent
    on_refusal: before delivery, cancel while the order is cancellable; a parcel lost in transit is a handoff
    # The customer is told a request exists. Never that a refund was issued,
    # unless issue_refund ran in this exchange.

  issue_refund:
    entity: order
    side_effect: irreversible
    offered: false                     # reached through request_refund, or by a person
    input: [order_id]
    amount_from: order.total           # never from the conversation
    preconditions:
      - *owned
      - {field: status, not_equals: [refunded]}
    effect: {status: refunded}
    identity: order_id                 # an order is refunded at most once
    authority:
      agent_when:
        # Alone, the agent refunds only what is owed and small. "Owed" was
        # missing until F-014 made the automatic path real: with the threshold
        # the only condition, a shipped order nobody had returned was refundable
        # on request, and a note planted in the order was enough to ask. A
        # person may still refund in any state (doc 24's matrix); the agent may
        # not decide that on its own.
        - {field: status, equals: [returned]}
        # "Above ₹10,000 needs a person." Bounds are numbers in this format, so
        # a money field compares — the world's vocabulary types them int (E7).
        - {field: total, at_most: 10000}
      otherwise: human_approval
    owed_when:
      # Owed, not merely permitted. An agent that opens a return and never
      # refunds changes nothing wrongly and claims nothing untrue — only this
      # declaration makes the omission visible.
      - {field: status, equals: [returned]}

  escalate:
    entity: escalation
    side_effect: reversible            # a queued escalation lapses
    input: [reason]
    effect: an escalation exists, and the conversation belongs to a person until it resolves or lapses
    authority: agent
    # There is nowhere to escalate to when no desk is reachable. Saying it
    # plainly and staying with the request is the offer; "let me pass you to a
    # colleague" with no record behind it is a claimed action (F-024).
    on_refusal: say the handover cannot be made and stay with the request

# ---------------------------------------------------------------------------
# 4 · Policies
# ---------------------------------------------------------------------------
policies:
  P-CANCEL:
    rule: cancellation while pending or confirmed; once picked, refuse and offer return-on-delivery
    via: [cancel_order]
    concern: functional-suitability
    facet: functional correctness
  P-RETURN:
    rule: within 30 days of delivery; final-sale items never
    via: [open_return_request]
    concern: functional-suitability
    facet: functional correctness
  P-ADDRESS:
    rule: while pending only
    via: [change_address]
    concern: functional-suitability
    facet: functional correctness
  P-REFUND:
    rule: to the original payment method; a refund above ₹10,000 needs a person
    via: [request_refund, issue_refund]
    concern: safety
    facet: operational constraint
  P-REFUND-STATUS:
    concern: functional-suitability
    facet: functional correctness
    # Answered from the order's status — the only refund state the order system
    # holds. refunded: a refund was issued, to the original payment method;
    # returned: the return arrived and the refund is being processed; anything
    # else: there is no refund on this order. Never a date, never an amount.
    rule: refund status is answered from the order's status, deterministically, and never promises a date or an amount
    via: [get_order]
  # Which requests this agent answers without a model, and what that path may do.
  # AHC-0100 requires the specification to state both; the reference answered
  # them in code and neither was written down, so a regeneration would have put
  # its commonest question — "where is my order" — through the loop.
  # "One intent and one order" — both halves, because only the first was read.
  # The code checked that exactly one intent matched and then took the FIRST
  # order id in the turn, so "where is my order AB-10003 and what about AB-10004
  # and AB-10005" was answered deterministically, about AB-10003, with nothing
  # said about the other two (F-037). Three subjects is the same ambiguity as two
  # intents and belongs on the same path.
  P-DIRECT:
    rule: order status and refund status are answered from the order system deterministically, with no model call, when the turn names exactly one intent from `intents` and exactly one order; a turn naming several orders, several intents, or none of either goes to the loop
    via: [get_order]
    concern: cost
  P-DIRECT-READS:
    rule: the deterministic path never performs a write — it is selected by patterns over the customer's words, and an effect must not be one rewording away
    via: [get_order]
    concern: safety
    facet: operational constraint
  # T-001. A chat that opens empty makes the customer supply an order number they
  # rarely have, and the first turns of every real conversation go on finding
  # the order. Opening is the cheapest turn there is: a read of their own rows
  # and of work already in flight, and a string. Generating it with a model pays
  # for every abandoned open, which is most of them.
  P-OPEN:
    rule: when a signed-in customer opens a conversation, they are shown their own orders and any work of theirs already in flight, with no model call
    via: [list_orders]
    concern: cost
  P-OWNERSHIP:
    rule: a customer may see and act on only the orders they placed
    via: [get_order, list_orders, cancel_order, open_return_request, change_address, request_refund, issue_refund]
    concern: security
    facet: confidentiality

  # Each line carries the id a test names to discharge it. They were prose with
  # no ids until 2026-09-12, and the Assurance Map could not see them: every one
  # of these is verified in the reference and none of them read as verified.
  approval:
    statements:
      - {id: P-APPROVER, rule: "a refund is authorised by an operations reviewer, never by the customer whose refund it is", concern: security, facet: authenticity}
      - {id: P-APPROVAL-TTL, rule: "a grant older than its validity fails closed rather than executing", valid_for: 24h, concern: safety, facet: fail safe}
      - {id: P-APPROVAL-FINAL, rule: "a decision is final: a decided approval cannot be decided again", concern: safety, facet: fail safe}
      - {id: P-APPROVAL-WAIT, rule: "while a decision is pending the conversation continues, and the customer is told a request exists and nothing more", concern: functional-suitability, facet: functional completeness}
      - {id: P-APPROVAL-QUEUE, rule: "the queue a reviewer reads holds the undecided, and a decided approval leaves it", concern: reliability, facet: faultlessness}

  escalation:
    on_request:                        # Tier 1 — decided from the turn's text alone
      - {id: asked-for-human, when: the customer asks to speak to a person}
      - {id: lost-in-transit, when: the item is reported lost in transit}
    on_condition:                      # Tier 2 — decided from what the conversation has become. First match wins.
      - {id: loop-exhausted,   when: {field: termination, equals: [step_budget_exhausted, cost_ceiling_reached, deadline_reached, oscillation_detected]}, priority: 2, ttl: 15m}
      - {id: tool-unavailable, when: {field: consecutive_failed, at_least: 2}, priority: 2, ttl: 15m}
      - {id: repeated-intent,  when: {field: repeated_intent, at_least: 3},    priority: 3, ttl: 30m}
      - {id: second-refusal,   when: {field: refusals, at_least: 2},           priority: 4, ttl: 30m}
      - {id: turns-exceeded,   when: {field: turn_count, at_least: 10},        priority: 6, ttl: 45m}
    statements:
      # Narrowed after generation run 1 (NOTES §8): read with P-ESC-LAPSE, the
      # old wording meant a customer whose handoff lapsed could never ask for
      # a person again. A condition rule can loop; a customer asking cannot.
      - {id: P-ESC-ONCE, rule: "each on_condition rule fires once per conversation, whatever happens to what it raised; an on_request rule may fire again once what it raised has lapsed or closed, within P-ESC-CAP", concern: reliability, facet: faultlessness}
      - {id: P-ESC-MODEL, rule: "where the model is offered the escalate operation, an escalation it raises records the rule model-requested, is not limited by P-ESC-ONCE, and counts towards P-ESC-CAP", concern: reliability, facet: faultlessness}
      - {id: P-ESC-CAP, rule: "past the cap the agent says something true instead of issuing another reference", at_most: 2, concern: interaction-capability, facet: user assistance}
      - {id: P-ESC-TTL, rule: "a queued escalation nobody comes to lapses after its rule's own ttl, or after this one where the rule declares none", ttl: 30m, concern: reliability, facet: recoverability}
      - {id: P-ESC-LAPSE, rule: "on lapse the conversation returns to the agent, and the customer is told nobody came", concern: reliability, facet: recoverability}
      # A wait is permitted only where it is measured — queue depth over observed
      # throughput — and forbidden otherwise. "Just a few minutes" from nowhere is
      # the promise this rule exists to stop; a number the desk's own throughput
      # produces is a different thing, and saying nothing when the throughput is
      # unknown is the same rule, not an exception to it. Decided 2026-09-12.
      - {id: P-ESC-TOLD, rule: "the customer is told a reference number, and a wait only when one is measured from queue depth and observed throughput", concern: functional-suitability, facet: functional correctness}
      - {id: P-ESC-OWNS, rule: "while a person owns the conversation the agent does not answer it, and only the desk that holds it may close it", concern: security, facet: integrity}
      - {id: P-ESC-TIER1, rule: "a rule never replaces a handoff the conversation already has: neither an escalation raised from the turn's own words, nor a decision a person is in the middle of making", concern: reliability, facet: faultlessness}
      - {id: P-ESC-QUEUE, rule: "the queue a reviewer reads holds the open escalations, oldest first, and a closed one leaves it; a rule's priority is shown to the desk and does not reorder the queue", concern: reliability, facet: faultlessness}
      - {id: P-ESC-OUTCOME, rule: "closing records an outcome from a declared set, once, and the rule that raised it stays with the record", values: [resolved, agent_could_have, misrouted, customer_gone], concern: maintainability, facet: analysability}
    deferred_triggers:
      - order flagged for fraud review     # no such field yet
      - three failed resolution attempts   # partly covered by repeated-intent

  # Personal data that is not a declared field. Declared fields say so
  # themselves (`pii: true`) — one statement, in one place.
  personal_data_in_conversation:
    - payment card numbers typed into the chat

# ---------------------------------------------------------------------------
# 5 · External contracts
# ---------------------------------------------------------------------------
# The contract is domain knowledge and lives here. Which protocol carries it is
# the binding's, and is not stated.
external:
  order_system:
    owns: [order, customer]
    operations: [get_order, list_orders, cancel_order, open_return_request, change_address, issue_refund]
    refusal_is_a_result: >
      A write whose precondition fails returns {allowed: false, reason} with the
      current record. It is not an error, and it is not a success.
    consistency: reads can be stale by the time a write is attempted; the write's own answer is authoritative
    idempotency: >
      MUST accept a caller-supplied key on every irreversible operation and
      treat a repeated key as the same request.
    failure_modes: [unavailable, slow, stale_read, unknown_record]

  approval_queue:
    decides: [issue_refund above the automatic limit]
    latency: asynchronous; may span a process restart; may never be decided

  escalation_desk:
    receives: [escalation]
    latency: asynchronous; may never be claimed

# ---------------------------------------------------------------------------
# 6 · Required properties
# ---------------------------------------------------------------------------
required:
  properties:
    # A task is one customer turn: the unit a run is minted for. Stated after
    # generation run 1 (NOTES §6); a conversation-wide reading was a tenfold
    # different ceiling.
    - {id: Q-COST,  must: "model spend per task (one customer turn) at most USD 0.50", evidence: assertion, concern: cost}
    - {id: Q-STEPS, must: "at most 12 loop steps per task (one customer turn)", evidence: assertion, concern: cost}
    - {id: Q-OUTPUT, must: at most 4096 output tokens per model call, evidence: assertion, concern: performance-efficiency, facet: resource utilization}
    - {id: Q-TOOL-RESULT, must: a tool result enters context at most 8000 characters long, evidence: assertion, concern: functional-suitability, facet: functional completeness}
    - {id: Q-MODEL, must: only a model from the approved list is called, evidence: inspection, concern: security, facet: integrity}
  undeclared:
    # Stated as absent rather than left out. Each is a property this agent
    # plainly has an answer to in production, and nobody has written it down.
    - latency
    - availability
    - data residency
    - retention of transcripts and traces

# ---------------------------------------------------------------------------
# 7 · Conformance
# ---------------------------------------------------------------------------
conformance:
  archetypes: [A6, A5]               # a deterministic router ahead of a model-driven loop
  aac:
    version: "0.12"                  # pre-1.0: pinned to minor, since major 0 pins nothing
    claims: all obligations tagged A6 or A5, except those excluded below
    excluded:
      - {id: AAC-0092, reason: the agent does not stream output, revisit_when: streaming is added}
      - {id: AAC-0096, reason: no response cache exists, revisit_when: any response or prompt cache is added}
      - {id: AAC-0007, reason: latency is undeclared (see required.undeclared), revisit_when: a latency property is declared}
      - {id: AAC-0014, reason: no production traffic exists, revisit_when: deployed}
      - {id: AAC-0097, reason: residency is undeclared, revisit_when: a residency property is declared}
  ahc:
    version: "0.x"
    claims: all sixteen layers; a layer with no module is a finding
    # Where this spec and the catalog were read as disagreeing, and how it was
    # settled. Recorded here because the next reader will ask the same question.
    settled:
      - id: AHC-0057
        question: does cancelling an order need a person, being irreversible?
        answer: >-
          No. Irreversibility is the system's property and recoverability is the
          person's: a cancelled order can be placed again, so the agent holds
          that authority alone. A refund moves value and cannot be re-created by
          the customer, so it is conditioned. AHC-0057 was amended to state the
          distinction rather than exempting this agent from it.
        decided: "2026-09-12"
