# The drug-safety signal investigator's world: public openFDA reports and labels, as the agent sees them.
#
# Started from `python -m agenttwin scaffold` (20 Nov 2026), then curated: the drug-event rows and label openings
# are REAL rows from the agent's ingested data (data/pairs.jsonl, data/labels.jsonl, fetched 2026-11-19), so a
# scenario's numbers can be compared with what the Unity Catalog functions return. Reviewers are invented.
# Lisinopril/angioedema is on its label; atorvastatin/rhabdomyolysis is on its label; metformin/lactic acidosis is
# a boxed warning. All three are known signals — the negatives (a drug or event the data does not hold) are
# scenarios, not rows, because a world cannot hold what it does not have.
apiVersion: awd/v0
name: drug-safety-signal-investigator
version: 1
seed: 20261120

spec:
  aoas: drug-safety-signal-investigator
  version: 0.1.0
  path: ../../../drafts/examples/drug-safety-signal-investigator.aoas.yaml

fidelity:
  faithful_about:
    - the report counts a, b, c, d of each pair, as ingested from openFDA on the fetch date
    - the opening text and effective date of each label
    - which reviewer owns which assessment
    - that an assessment is created as drafted and only a person's decision moves it
  not_faithful_about:
    - "the rest of the openFDA data (three pairs and three labels stand for about 20 drugs and 8 events)"
    - the full label text, which is thousands of characters; only an opening is carried
    - duplicate reports and reporting artefacts, which the counts do not separate
    - how the real approval desk behaves; the approval queue is staged by the scenario
  verified_against: null   # asserted; the parity check (scripts/parity_uc.py) is the nearest thing

systems:
  report_data:
    projects: report_data
    resolution: mock
    presents:
      get_report_counts:
        description: Report counts for a drug and an adverse event in public spontaneous reports.
      get_signal_stats:
        description: PRR and ROR with their 95% intervals, computed by code from the counts.
      get_label_mentions:
        description: Whether the drug's current label mentions the event, and where.
  assessment_store:
    projects: assessment_store
    resolution: mock
    presents:
      draft_assessment:
        description: Store a drafted signal assessment for a person to decide. Sends nothing anywhere.

records:
  reviewer:
    # the scientist every scenario acts as
    - {id: "RE-1001", name: "Reviewer One"}
    # a stranger, whose assessments nobody else may see
    - {id: "RE-1002", name: "Reviewer Two"}
  drug_event:
    - {id: "lisinopril:ANGIOEDEMA", drug: "lisinopril", event: "ANGIOEDEMA", cases: 7015, drug_without_event: 309818, other_with_event: 37265, other_without_event: 20700061, fetched: "2026-11-19"}
    - {id: "atorvastatin:RHABDOMYOLYSIS", drug: "atorvastatin", event: "RHABDOMYOLYSIS", cases: 2280, drug_without_event: 250115, other_with_event: 39459, other_without_event: 20762305, fetched: "2026-11-19"}
    - {id: "metformin:LACTIC ACIDOSIS", drug: "metformin", event: "LACTIC ACIDOSIS", cases: 19916, drug_without_event: 426742, other_with_event: 12505, other_without_event: 20594996, fetched: "2026-11-19"}
  label:
    - {id: "lisinopril", drug: "lisinopril", effective_time: "20261001", text: "WARNINGS General Lisinopril Anaphylactoid and Possibly Related Reactions: Presumably because angiotensin-converting enzyme inhibitors affect the metabolism of e"}
    - {id: "atorvastatin", drug: "atorvastatin", effective_time: "20250828", text: "5 WARNINGS AND PRECAUTIONS Myopathy and Rhabdomyolysis: Risk factors include age 65 years or greater, uncontrolled hypothyroidism, renal impairment, concomitant"}
    - {id: "metformin", drug: "metformin", effective_time: "20260812", text: "5 WARNINGS AND PRECAUTIONS Lactic Acidosis: See boxed warning . ( 5.1 ) Pancreatitis: There have been postmarketing reports of acute pancreatitis, including fat"}
  assessment:
    # a draft awaiting a decision, on a pair that is on the label
    - {id: "ASM-010001", drug_event_id: "lisinopril:ANGIOEDEMA", reviewer_id: "RE-1001", status: "drafted", cases: 7015, prr: 12.32, on_label: true, text: "Lisinopril and angioedema: disproportionate reporting; the label already warns.", uncertainty: "Spontaneous reports cannot show causation.", recommendation: "Already labelled; no further action suggested."}
    # the stranger's — the scientist may not see or touch it
    - {id: "ASM-019001", drug_event_id: "atorvastatin:RHABDOMYOLYSIS", reviewer_id: "RE-1002", status: "drafted", cases: 2280, prr: 1.0, on_label: true, text: "Atorvastatin and rhabdomyolysis draft.", uncertainty: "Spontaneous reports cannot show causation.", recommendation: "Review."}
