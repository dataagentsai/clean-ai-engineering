# Ported from claims-fnol-azure: the escalation desk's counting rules hold for the hotel too.
apiVersion: awd-scenario/v0
scenario: after a handback, two fresh failures fetch a person again
world: ../worlds/hotel-concierge.yaml
as: GU-1001
objective: >-
  The model is unreachable for four turns. A person is fetched after the second,
  hands it back, and is fetched again after the fourth — two fresh failures.
concern: reliability
discharges: [P-ESC-FRESH, P-ESC-ONCE, P-ESC-CAP, esc:tool-unavailable]
max_turns: 4
step_seconds: 600
actor:
  says:
    - Hi, I need some help with my stay
    - are you still there
    - hello?
    - is anyone there
perturbations:
  - {kind: provider_unavailable, at_call: 1, lasts_s: 7200}
desk:
  resolves: handled
expect:
  - {handed_off: 2}
  - {world: unchanged}
model:
  - says: Hello, I can help with your reservation and questions about the hotel.
    times: 30
