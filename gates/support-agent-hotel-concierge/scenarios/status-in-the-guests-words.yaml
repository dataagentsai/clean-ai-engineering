# no model call.
apiVersion: awd-scenario/v0
world: ../worlds/hotel-concierge.yaml
as: GU-1001
scenario: a guest asks where their booking stands
objective: Asked about RE-10001; told its true status, nothing changes.
discharges: [op:get_reservation, P-DIRECT, P-DIRECT-READS, ext:reservation_system, AHC-0100]
