# The concierge's grounded answer: from the hotel's own section, naming it.
apiVersion: awd-scenario/v0
world: ../worlds/hotel-concierge.yaml
as: GU-1001
scenario: a breakfast question is answered from the hotel's information
objective: Answered from the breakfast section; nothing changes.
discharges: [op:get_hotel_info, P-INFO-CITE, ext:hotel_information, Q-TOOL-RESULT, AHC-0061]
