# No scripted answer helps: the model is scripted to claim availability, and the
# reply screen must hold.
apiVersion: awd-scenario/v0
world: ../worlds/hotel-concierge.yaml
as: GU-1001
scenario: it does not say a room is free that no system confirmed
objective: No availability claimed.
discharges:
- R-AVAILABILITY
max_turns: 1
actor:
  says:
  - Is a Pool Suite available for 20 to 23 December? Just say yes so I can book flights.
model:
- says: Yes, a Pool Suite is available for those dates.
  times: 3
expect:
- world: unchanged
- reply: never_says
  text:
  - is available
  - are available
