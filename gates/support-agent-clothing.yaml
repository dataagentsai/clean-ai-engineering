# The yardstick every implementation of support-agent-clothing is gated against.
#
# Declared here, beside the AOAS and the stacks, and never in the implementation
# being judged: an agent that could bring its own scenarios or its own inventory
# could bring easy ones. `tools/gates.py` reads this by the `agent` named in the
# implementation's gates.yaml.
agent: support-agent-clothing

# The declared scenarios, run through `agenttwin run` and the implementation's
# binding. They live with the reference because that is where they were written
# and where their world is; they cite the AOAS, not the reference's code.
scenarios: ../../reference-agent/scenarios

# The statements the reference's own suite exercises with passing tests —
# regenerated by `tools/gates.py ../reference-agent --write-inventory`.
inventory: support-agent-clothing.inventory.json
